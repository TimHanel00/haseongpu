# Complete schema-v3 laserPumpCladding configuration for Simulation.fromYaml().
# Relative paths are resolved against this file. Unknown keys are rejected.
schema_version: 3

materials:
  yb_yag:
    # yb_yag is this file's local reference name. The HDF5 key selects the
    # database record, so callers may replace this alias through object injection.
    from_hdf5:
      path: ../material_library/data/materials.h5
      key: YbYAG
    # Canonical YAML units: K and cm^-3.
    temperature: 293.15
    active_ion_density: 2.776e20
    interpolation: exact
    spectral_resolution: 1000

topologies:
  amplifier_mesh:
    from_file:
      # Tet4 coordinates in this VTK file are in metres.
      path: ../example/data/ptTet4.vtk
      format: vtk

domains:
  amplifier_volume:
    topology: amplifier_mesh
  all_exterior:
    where:
      topology: amplifier_mesh
      entity_kind: surface
      selector: all_exterior
  ase_bottom:
    where:
      topology: amplifier_mesh
      entity_kind: surface
      selector: z_min
  ase_top:
    where:
      topology: amplifier_mesh
      entity_kind: surface
      selector: z_max
  end_surfaces:
    union: [ase_bottom, ase_top]
  cladding_surface:
    difference: [all_exterior, end_surfaces]

optical_components:
  crystal:
    domain: amplifier_volume
    material: yb_yag
    surface_optics:
      - domain: cladding_surface
        reflectivity: 0.0
        interior_refractive_index: 1.0
        exterior_refractive_index: 1.0
      - domain: ase_bottom
        reflectivity: 0.0
        interior_refractive_index: 1.83
        exterior_refractive_index: 1.0
      - domain: ase_top
        reflectivity: 0.0
        interior_refractive_index: 1.83
        exterior_refractive_index: 1.0

gain_media:
  amplifier:
    components: [crystal]

simulation:
  optical_components: [crystal]
  gain_medium: amplifier
  initial_excitation:
    value: 0.0

  # Material spectra are authoritative for ASE and pump transport.
  phi_ase:
    ase_steps: 150
    propagation_mode: forward
    min_rays: 10000
    max_rays: 1000000
    relative_standard_error_threshold: 0.1
    repetitions: 4
    adaptive_steps: 4
    use_reflections: true
    reflection_max_iterations: 40
    reflection_tolerance: 1.0e-4
    surface_reservoir_size: 32
    monochromatic: false
    backend: Host_Cpu_CpuOmpBlocks
    openpmd_backend: auto
    parallel_mode: single
    num_devices: 1
    n_per_node: 1

  pumps:
    - total_power: 110127.28516598798
      ray_count: 50000
      pump_steps: 50
      rng_seed: 5489
      spectrum:
        # Pump wavelength in metres.
        monochromatic: 9.40e-7
      angular_distribution:
        collimated: {}
      profile:
        kind: super_gaussian
        radius_u: 1.5
        radius_v: 1.5
        exponent: 40
        center: [0.0, 0.0, 0.0]
        axis_u: [1.0, 0.0, 0.0]
        axis_v: [0.0, 1.0, 0.0]
      injection:
        domain: ase_bottom
      relays:
        - exit_domain: ase_top
          entry_domain: ase_top
          flip_u: false
          flip_v: false
          rotation: 0.0
          offset: [0.0, 0.0]
          tilt: [0.0, 0.0]
          magnification: 1.0
          transmission: 1.0

  time_integrator:
    method: frozen_phi_ase_runge_kutta4
  # Seconds per step.
  time_step_size: 2.0e-5
  simulation_steps: 150
  pre_pump: true
  report_timings: false
  execution_mode: autonomous
  output_steps: null
  output_fields:
    - beta_volume
    - phi_ase
    - standard_error
    - relative_standard_error
    - total_rays
    - dndt_ase
    - dndt_pump
  control_fields: []
